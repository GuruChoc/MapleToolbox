name: Assemble MapleToolbox source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble source
        shell: bash
        run: |
          if [ ! -d payload ]; then
            echo "No payload directory. Nothing to assemble."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import base64, zlib, py_compile

          parts = sorted(Path('payload').glob('part*.txt'))
          if not parts:
              raise SystemExit('No payload parts found')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          source = zlib.decompress(base64.b64decode(encoded))
          Path('MapleToolbox.py').write_bytes(source)
          py_compile.compile('MapleToolbox.py', doraise=True)
          print(f'Assembled MapleToolbox.py: {len(source)} bytes from {len(parts)} parts')
          PY

          rm -rf payload

      - name: Commit assembled source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MapleToolbox.py
          git add -A payload || true
          git commit -m "Assemble MapleToolbox v0.23 public beta source"
          git push
